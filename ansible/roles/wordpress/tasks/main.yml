- name: Mettre à jour l'index apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer paquets nécessaires
  ansible.builtin.apt:
    name:
      - apache2
      - mariadb-server
      - php
      - php-mysql
      - libapache2-mod-php
      - python3-pymysql
      - unzip
      - wget
    state: present

- name: Démarrer et activer Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Démarrer et activer MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Configurer le mot de passe root MariaDB
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ wordpress_db_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    state: present

- name: Créer la base WordPress
  community.mysql.mysql_db:
    name: "{{ wordpress_db_name }}"
    state: present
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"

- name: Créer l'utilisateur WordPress
  community.mysql.mysql_user:
    name: "{{ wordpress_db_user }}"
    password: "{{ wordpress_db_password }}"
    priv: "{{ wordpress_db_name }}.*:ALL"
    host: localhost
    state: present
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"

- name: Télécharger WordPress
  ansible.builtin.get_url:
    url: https://wordpress.org/latest.zip
    dest: /tmp/wordpress.zip
    mode: "0644"

- name: Décompresser WordPress
  ansible.builtin.unarchive:
    src: /tmp/wordpress.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/wordpress

- name: Copier WordPress vers /var/www/html
  ansible.builtin.copy:
    src: /tmp/wordpress/
    dest: /var/www/html/
    remote_src: true
    owner: www-data
    group: www-data
    mode: "0755"
  notify: Restart Apache

- name: Générer le fichier wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: /var/www/html/wp-config.php
    owner: www-data
    group: www-data
    mode: "0640"
  notify: Restart Apache
